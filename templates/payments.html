<!DOCTYPE html>
<html>

<head>
    <title>Payment History</title>
</head>

<body>

<h1>Payment History</h1>

<table border="1">

<tr>
    <th>Customer Name</th>
    <th>Policy Name</th>
    <th>Amount</th>
</tr>

{% for payment in payments %}

<tr>
    <td>{{ payment[1] }}</td>
    <td>{{ payment[2] }}</td>
    <td>{{ payment[3] }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/dashboard">Back to Dashboard</a>

</body>

</html>
